<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkPulse 打工人儀表板</title>
<meta name="description" content="班表、即時薪資、年終倒數、特休與加班費的打工人工具箱">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkPulse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><b>WorkPulse</b></div>
  <div class="top-mid"><span data-live="date"></span> <span class="neon-num" data-live="clock"></span></div>
  <button class="icon-btn" data-act="toggleHide" aria-label="隱藏或顯示金額" id="eyeBtn"></button>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
